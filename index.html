<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Agroganadero - Datos en Vivo</title>
    <style>
        /* Estilos base para que el diseño se adapte de forma nativa */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: transparent; /* Permite que tome el fondo de la radio */
            color: #333;
        }

        /* Contenedor principal que va a envolver todo tu diseño */
        #contenedor-mercado-datos {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        /* Ejemplo de estilos para tus tablas o tarjetas de hacienda */
        /* (Acá abajo van los estilos reales que ya tengas armados) */
        .tabla-agro {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .tabla-agro th, .tabla-agro td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .tabla-agro th {
            background-color: #2c3e50;
            color: white;
        }
    </style>
</head>
<body>

    <div id="contenedor-mercado-datos">
        
        <h2>Información del Mercado Agroganadero</h2>
        <p>Datos actualizados directamente desde el mercado.</p>

        <table class="tabla-agro">
            <thead>
                <tr>
                    <th>Categoría</th>
                    <th>Cantidad</th>
                    <th>Precio Mín.</th>
                    <th>Precio Máx.</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Novillos</td>
                    <td>120</td>
                    <td>$2.100</td>
                    <td>$2.450</td>
                </tr>
                <tr>
                    <td>Vaquillonas</td>
                    <td>85</td>
                    <td>$2.000</td>
                    <td>$2.300</td>
                </tr>
                </tbody>
        </table>

    </div>

</body>
</html>
